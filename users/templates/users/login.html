{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Вход</h1>
<form method="post">
  {% csrf_token %}
  {{ form.non_field_errors }}
  <div class="mb-2">
    <label>Email</label>
    {{ form.username }}
    {{ form.username.errors }}
  </div>
  <div class="mb-3">
    <label>Пароль</label>
    {{ form.password }}
    {{ form.password.errors }}
  </div>
  <button class="btn btn-warning text-dark fw-semibold">Войти</button>
</form>
{% endblock %}
