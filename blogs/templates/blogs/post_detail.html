{% extends "base.html" %}
{% block content %}
{% include "includes/_menu.html" %}
<div class="container py-4">
  <h1 class="mb-2">{{ post.title }}</h1>
  <p class="text-muted mb-3">Опубликовано: {{ post.created_at|date:"d.m.Y H:i" }} · 👁 {{ post.views }}</p>
  {% if post.preview %}<img src="{{ post.preview.url }}" class="img-fluid mb-3" alt="preview">{% endif %}
  <div class="mb-4">{{ post.content|linebreaks }}</div>
  <a class="btn btn-secondary" href="{% url 'blogs:list' %}">← Ко всем записям</a>
  <a class="btn btn-primary" href="{% url 'blogs:update' post.pk %}">Редактировать</a>
  <a class="btn btn-danger" href="{% url 'blogs:delete' post.pk %}">Удалить</a>
</div>
{% endblock %}
