{% extends "base.html" %}
{% block content %}
{% include "includes/_menu.html" %}
<div class="container py-4">
  <h1 class="mb-3">Удалить: “{{ object.title }}”?</h1>
  <form method="post" class="d-flex gap-2">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Удалить</button>
    <a class="btn btn-secondary" href="{{ object.get_absolute_url }}">Отмена</a>
  </form>
</div>
{% endblock %}
