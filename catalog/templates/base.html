{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Магазин{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{
      min-height:100vh;margin:0;color:#fff;
      background:
        radial-gradient(1000px 600px at 10% -10%, #3a4148 0%, transparent 50%),
        linear-gradient(160deg, #2c3e50, #34495e 65%, #2b3036);
    }
    .btn-glow{transition:transform .15s ease, box-shadow .15s ease}
    .btn-glow:hover{box-shadow:0 0 .9rem rgba(255,193,7,.55);transform:translateY(-1px)}
    .center-wrap{min-height: calc(100vh - 72px);}
    .card-bg{background-color:#2f3b47;border-color:#445361;color:#fff;}
    .muted{color:#c8d1d9}
    .img-cover{object-fit:cover;height:180px}
  </style>
</head>
<body class="d-flex flex-column">
  {% include "partials/_menu.html" %}
  <main class="container center-wrap py-4">
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
