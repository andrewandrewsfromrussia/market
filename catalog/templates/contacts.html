<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Контакты</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: #2f343a;
      color: #f2f2f2;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    .wrap { text-align: center; padding: 24px; max-width: 520px; }
    .buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 12px 0 18px; }
    .btn {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 12px;
      background: #3a4047;
      color: #fff; text-decoration: none; font-weight: 600;
      border: 1px solid #4a5159;
      transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
    }
    .btn:hover { background: #444b53; box-shadow: 0 6px 14px rgba(0,0,0,.35); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .card {
      text-align: left;
      background: #363c43;
      border: 1px solid #4a5159;
      border-radius: 12px;
      padding: 16px;
      margin: 0 auto;
    }
    .card p { margin: 8px 0; }
    .card a { color: #fff; text-decoration: none; }
    .card a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Контакты</h1>

    <div class="buttons">
      <a class="btn" href="{% url 'catalog:home' %}">Главная</a>
      <a class="btn" href="{% url 'catalog:contacts' %}">Контакты</a>
    </div>

    <section class="card" aria-label="Контакты">
      <p>Телефон: +7 900 000-00-00</p>
      <p>Почта: <a href="mailto:hello@example.com">andrewardyour@gmail.com</a></p>
      <p>Telegram: <a href="https://t.me/andrewardyour" target="_blank" rel="noopener">@andrewardyour</a></p>
    </section>
  </main>
</body>
</html>
