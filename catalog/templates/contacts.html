<!doctype html>
<html lang="ru">
<head>

  <title>Контакты</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{
      min-height:100vh;
      margin:0;
      color:#e9ecef;
      background:
        radial-gradient(1000px 600px at 10% -10%, #3a4148 0%, transparent 50%),
        linear-gradient(160deg, #2c3e50, #34495e 65%, #2b3036);
    }
    .btn-glow:hover{ box-shadow:0 0 .9rem rgba(255,193,7,.55); transform:translateY(-1px) }
    .btn-glow{ transition:transform .15s ease, box-shadow .15s ease }
    .center-wrap{ min-height: calc(100vh - 72px); }

<body class="d-flex flex-column">

  <header class="py-3">
    <div class="container d-flex justify-content-end gap-2">
      <a class="btn btn-outline-light btn-sm btn-glow" href="{% url 'catalog:home' %}">Главная</a>

  </header>

  <main class="container center-wrap d-flex align-items-center justify-content-center">
    <div class="text-center" style="max-width:560px">
      <h1 class="display-5 fw-semibold mb-3">Контакты</h1>

      <div class="card text-bg-dark border-secondary mb-4 text-start">
        <div class="card-body">
          <p class="mb-2">Почта: <a class="link-warning text-decoration-none" href="mailto:andrewardyour@gmail.com">andrewardyour@gmail.com</a></p>
          <p class="mb-0">Telegram: <a class="link-warning text-decoration-none" href="https://t.me/andrewardyour" target="_blank" rel="noopener">t.me/andrewardyour</a></p>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
